name: Build check (temporary)
on:
  push:
    branches:
      - static-duckdb-extensions

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            run: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            run: false
          - target: x86_64-apple-darwin
            os: macos-latest
            run: true
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            run: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            run: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build
        shell: bash
        run: time cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      - name: Report size
        shell: bash
        run: ls -l target/${{ matrix.target }}/release/apitally*
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/apitally
          $BIN reset-db --db test.duckdb
          for i in $(seq 20); do
            echo "SELECT date_trunc('day', now() AT TIME ZONE 'UTC') AS day, now()::DATE AS d, now() - INTERVAL 1 DAY AS y, '{\"a\":1}'::JSON->>'\$.a' AS j" | $BIN sql --db test.duckdb
          done
          echo "SELECT extension_name, install_mode FROM duckdb_extensions() WHERE loaded" | $BIN sql --db test.duckdb
