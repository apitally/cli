name: Build check (temporary)
on:
  push:
    branches:
      - static-duckdb-extensions

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      # Keeps DuckDB's CMake object paths below the MSVC 260 character limit
      CARGO_TARGET_DIR: ${{ runner.os == 'Windows' && 'C:/t' || 'target' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: time cargo build --release --target ${{ matrix.target }}
      - name: Report size
        shell: bash
        run: ls -l $CARGO_TARGET_DIR/${{ matrix.target }}/release/apitally*
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar czf apitally-${{ matrix.target }}.tar.gz -C $CARGO_TARGET_DIR/${{ matrix.target }}/release apitally && ls -l apitally-*.tar.gz
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path $env:CARGO_TARGET_DIR/${{ matrix.target }}/release/apitally.exe -DestinationPath apitally-${{ matrix.target }}.zip
          Get-Item apitally-*.zip | Format-List Name, Length
      - name: Smoke test
        shell: bash
        run: |
          BIN=$CARGO_TARGET_DIR/${{ matrix.target }}/release/apitally
          $BIN reset-db --db test.duckdb
          for i in $(seq 20); do
            echo "SELECT date_trunc('day', now() AT TIME ZONE 'UTC') AS day, now()::DATE AS d, now() - INTERVAL 1 DAY AS y, '{\"a\":1}'::JSON->>'\$.a' AS j" | $BIN sql --db test.duckdb
          done
          echo "SELECT extension_name, install_mode FROM duckdb_extensions() WHERE loaded" | $BIN sql --db test.duckdb
