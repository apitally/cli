[package]
name = "apitally"
version = "0.0.0"
edition = "2024"
description = "Apitally CLI"
license = "MIT"

[dependencies]
anyhow = "1"
arrow = { version = "=60.0.0", default-features = false, features = [
    "ipc",
    "json",
    "chrono-tz",
] }
arrow-ipc = { version = "=60.0.0", features = ["lz4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
duckdb = { git = "https://github.com/duckdb/duckdb-rs", tag = "v1.10506.1", features = [
    "bundled-cmake",
    "icu",
    "json",
    "appender-arrow",
] }
iana-time-zone = "0.1"
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"
